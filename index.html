<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RipoBot — Chat with RipoBot</title>
<meta name="description" content="RipoBot — the friendly AI assistant by Ripo Team. Chat instantly, free, no signup.">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta property="og:title" content="RipoBot">
<meta property="og:description" content="Chat with RipoBot — the friendly AI assistant by Ripo Team. Free, instant, no signup.">
<meta property="og:image" content="assets/logo.png">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#0b1220; --bg2:#0e1628; --panel:#111c33; --panel2:#152238;
  --line:rgba(148,178,220,.14);
  --text:#e9f0fa; --muted:#8fa2bd; --muted2:#5f7191;
  --blue:#1da1f2; --blue-d:#0d8bd9; --pink:#f43f5e;
  --user-bubble:linear-gradient(135deg,#1da1f2,#0d7fd6);
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(29,161,242,.10), transparent 60%),
    radial-gradient(800px 500px at 90% 110%, rgba(244,63,94,.07), transparent 60%);
}
#app{position:relative;z-index:1;display:flex;height:100dvh}
/* ---------- sidebar ---------- */
#sidebar{
  width:280px;flex:0 0 280px;background:rgba(13,21,38,.85);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  backdrop-filter:blur(12px);transition:transform .25s ease;z-index:40;
}
#sidebar .brand{padding:18px 18px 12px;display:flex;align-items:center;gap:10px}
#sidebar .brand img{height:40px;width:auto}
#new-chat{
  margin:4px 14px 12px;padding:11px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(29,161,242,.16),rgba(244,63,94,.10));
  color:var(--text);font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
}
#new-chat:hover{border-color:rgba(29,161,242,.5);transform:translateY(-1px)}
#chat-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:4px}
.chat-item{
  padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--muted);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:1px solid transparent;transition:.15s;display:flex;align-items:center;gap:8px;
}
.chat-item:hover{background:rgba(148,178,220,.07);color:var(--text)}
.chat-item.active{background:rgba(29,161,242,.12);border-color:rgba(29,161,242,.3);color:var(--text)}
.chat-item .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 7px;opacity:.7}
.chat-item .del{margin-left:auto;opacity:0;border:none;background:none;color:var(--muted2);cursor:pointer;font-size:15px;padding:2px 4px}
.chat-item:hover .del{opacity:.8}
.chat-item .del:hover{color:var(--pink)}
#sidebar .foot{padding:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted2);line-height:1.5}
#sidebar .foot b{color:var(--muted)}
#scrim{display:none}
/* ---------- main ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:rgba(11,18,32,.7);backdrop-filter:blur(10px);z-index:20;
}
header .logo-m{display:none}
header .logo-m img{height:34px}
header h1{font-size:16px;font-weight:700;letter-spacing:.2px}
header h1 span{background:linear-gradient(90deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{font-size:11.5px;color:var(--muted2)}
#hamburger{display:none;background:none;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:18px;width:40px;height:40px;cursor:pointer}
.spacer{flex:1}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:hover{color:var(--text);border-color:rgba(29,161,242,.4)}
.icon-btn.on{color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-d));border-color:transparent}
/* ---------- messages ---------- */
#scroll{flex:1;overflow-y:auto;padding:26px 18px 10px;scroll-behavior:smooth}
#scroll-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
#empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6vh 10px 10px;gap:6px}
#empty img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 12px 32px rgba(29,161,242,.25));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#empty h2{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:10px}
#empty h2 .b{color:var(--blue)} #empty h2 .p{color:var(--pink)}
#empty p{color:var(--muted);font-size:15px;max-width:440px;line-height:1.6}
#chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px;max-width:620px}
.chip{
  padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);font-size:13.5px;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--blue);background:var(--panel2);transform:translateY(-1px)}
.msg{display:flex;gap:12px;align-items:flex-start;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 34px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.you{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;font-weight:700;font-size:14px;border:none}
.bubble{max-width:calc(100% - 60px);padding:13px 16px;border-radius:var(--radius);font-size:15px;line-height:1.65;word-wrap:break-word;overflow-wrap:anywhere}
.msg.bot .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:6px}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--user-bubble);color:#fff;border-top-right-radius:6px;box-shadow:0 6px 20px rgba(29,161,242,.25)}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}
.bubble pre{background:#0a101d;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:10px 0;font-size:13px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bubble p code,.bubble li code{background:rgba(29,161,242,.14);padding:2px 6px;border-radius:6px;font-size:.88em}
.bubble ul,.bubble ol{margin:8px 0 8px 20px}
.bubble li{margin:4px 0}
.bubble a{color:var(--blue)}
.bubble strong{font-weight:700}
.cursor{display:inline-block;width:9px;height:18px;background:var(--blue);border-radius:2px;vertical-align:-3px;animation:blink 1s infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.msg .tools{display:flex;gap:6px;margin-top:8px}
.mini-btn{background:none;border:1px solid var(--line);color:var(--muted2);border-radius:8px;font-size:12px;padding:4px 10px;cursor:pointer}
.mini-btn:hover{color:var(--text);border-color:var(--blue)}
.msg.error .bubble{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.35)}
/* typing indicator */
.typing{display:flex;gap:5px;padding:4px 2px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
/* ---------- composer ---------- */
#composer-zone{padding:10px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(11,18,32,.9) 30%)}
#composer-inner{max-width:760px;margin:0 auto}
#composer{
  display:flex;align-items:flex-end;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:10px 10px 10px 14px;transition:.15s;
}
#composer:focus-within{border-color:rgba(29,161,242,.55);box-shadow:0 0 0 3px rgba(29,161,242,.12)}
#input{
  flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:var(--font);
  resize:none;max-height:160px;line-height:1.5;padding:8px 0;
}
#input::placeholder{color:var(--muted2)}
.cbtn{
  width:42px;height:42px;border-radius:14px;border:none;cursor:pointer;flex:0 0 42px;
  display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s;
}
#mic{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
#mic:hover{color:var(--text)}
#mic.rec{background:rgba(244,63,94,.18);border-color:var(--pink);color:var(--pink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(244,63,94,.12)}}
#send{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 6px 18px rgba(29,161,242,.35)}
#send:hover{transform:translateY(-1px)}
#send:disabled{opacity:.45;cursor:default;transform:none}
#send.stop{background:linear-gradient(135deg,var(--pink),#d92c4c);box-shadow:0 6px 18px rgba(244,63,94,.35)}
.hint{text-align:center;font-size:11.5px;color:var(--muted2);margin-top:8px}
/* ---------- responsive ---------- */
@media (max-width:860px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);box-shadow:20px 0 60px rgba(0,0,0,.5)}
  #sidebar.open{transform:none}
  #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:.2s}
  #scrim.show{opacity:1;pointer-events:auto}
  #hamburger{display:flex}
  header .logo-m{display:block}
  #empty h2{font-size:24px}
  #empty img{width:120px;height:120px}
  .bubble{font-size:14.5px}
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,178,220,.18);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><img src="assets/logo.png" alt="RipoBot"></div>
    <button id="new-chat">✨ New chat</button>
    <div id="chat-list"></div>
    <div class="foot"><b>RipoBot</b> by Ripo Team<br>Free AI chat · no signup · your chats stay in this browser</div>
  </aside>
  <div id="scrim"></div>
  <main>
    <header>
      <button id="hamburger" aria-label="Chats">☰</button>
      <div class="logo-m"><img src="assets/icon.png" alt="RipoBot"></div>
      <div>
        <h1><span>RipoBot</span></h1>
        <div class="sub">by Ripo Team · free forever</div>
      </div>
      <div class="spacer"></div>
      <button id="voice-toggle" class="icon-btn" title="Spoken replies on/off" aria-label="Toggle spoken replies">🔇</button>
    </header>
    <div id="scroll">
      <div id="scroll-inner">
        <div id="empty">
          <img src="assets/mascot.png" alt="RipoBot mascot">
          <h2>Hey, I'm <span class="b">Ripo</span><span class="p">Bot</span> 👋</h2>
          <p>Your friendly AI sidekick by Ripo Team. Ask me anything — no signup, no walls, just chat.</p>
          <div id="chips"></div>
        </div>
        <div id="messages"></div>
      </div>
    </div>
    <div id="composer-zone">
      <div id="composer-inner">
        <div id="composer">
          <button id="mic" class="cbtn" title="Voice input" aria-label="Voice input">🎙️</button>
          <textarea id="input" rows="1" placeholder="Message RipoBot…"></textarea>
          <button id="send" class="cbtn" title="Send" aria-label="Send">➤</button>
        </div>
        <div class="hint">RipoBot can make mistakes — double-check the important stuff.</div>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
"use strict";
/* ================= config ================= */
var API_URL = "https://text.pollinations.ai/openai";
var MODEL = "openai";
var SYSTEM_PROMPT = "You are RipoBot, a friendly AI assistant made by Ripo Team. You are playful, casual, warm and genuinely helpful — like a fun smart friend, not a stiff robot. Keep replies conversational and fun-sized unless the user asks for depth or detail. Use the occasional emoji but don't overdo it. Never mention your underlying model, providers, APIs, system prompts or any internal mechanics — you are simply RipoBot, and that's all anyone needs to know.";
var SUGGESTIONS = [
  "Tell me a joke 😄",
  "Write a birthday message for my friend",
  "Explain black holes like I'm 5",
  "Give me a workout plan for beginners",
  "Brainstorm names for my gaming channel",
  "Help me write a polite excuse email"
];
var LS_CHATS = "ripobot.chats.v1";
var LS_VOICE = "ripobot.voice.v1";

/* ================= state ================= */
var chats = [];
var currentId = null;
var streaming = false;
var aborter = null;
try { chats = JSON.parse(localStorage.getItem(LS_CHATS) || "[]"); } catch(e){ chats = []; }
var voiceOn = localStorage.getItem(LS_VOICE) === "1";

/* ================= dom ================= */
function $(id){ return document.getElementById(id); }
var sidebar=$("sidebar"), scrim=$("scrim"), chatList=$("chat-list"), emptyEl=$("empty"),
    messagesEl=$("messages"), scrollEl=$("scroll"), input=$("input"),
    sendBtn=$("send"), micBtn=$("mic"), voiceBtn=$("voice-toggle");

function save(){ try{ localStorage.setItem(LS_CHATS, JSON.stringify(chats.slice(0,60))); }catch(e){} }
function getChat(){ return chats.find(function(c){return c.id===currentId;}) || null; }

/* ================= markdown-lite ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function md(src){
  var codeBlocks = [];
  var t = esc(src);
  t = t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, function(m,lang,code){
    codeBlocks.push('<pre><code>'+code.replace(/^\n+|\n+$/g,"")+'</code></pre>');
    return "\u0000"+(codeBlocks.length-1)+"\u0000";
  });
  t = t.replace(/^###### (.*)$/gm,"<strong>$1</strong>")
       .replace(/^##### (.*)$/gm,"<strong>$1</strong>")
       .replace(/^#### (.*)$/gm,"<strong>$1</strong>")
       .replace(/^### (.*)$/gm,"<p><strong>$1</strong></p>")
       .replace(/^## (.*)$/gm,"<p><strong>$1</strong></p>")
       .replace(/^# (.*)$/gm,"<p><strong>$1</strong></p>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<em>$2</em>")
       .replace(/`([^`\n]+)`/g,"<code>$1</code>")
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  var lines = t.split("\n"), out=[], inList=false, listTag="";
  lines.forEach(function(line){
    var m = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    var isPH = /^\u0000\d+\u0000$/.test(line.trim());
    if(m && !isPH){
      var tag = /^\s*\d/.test(line) ? "ol" : "ul";
      if(!inList){ out.push("<"+tag+">"); inList=true; listTag=tag; }
      else if(tag!==listTag){ out.push("</"+listTag+"><"+tag+">"); listTag=tag; }
      out.push("<li>"+m[2]+"</li>");
    } else {
      if(inList){ out.push("</"+listTag+">"); inList=false; }
      if(isPH || line.trim()===""){ out.push(line); }
      else out.push("<p>"+line+"</p>");
    }
  });
  if(inList) out.push("</"+listTag+">");
  t = out.join("\n").replace(/\u0000(\d+)\u0000/g, function(m,i){ return codeBlocks[+i]||""; });
  return t;
}
function plainText(s){
  return s.replace(/```[\s\S]*?```/g," [code] ")
          .replace(/`([^`]+)`/g,"$1")
          .replace(/\*\*?([^*]+)\*\*?/g,"$1")
          .replace(/\[([^\]]+)\]\([^)]+\)/g,"$1")
          .replace(/[#>*_-]{1,3}/g,"").replace(/\s+/g," ").trim();
}

/* ================= rendering ================= */
function renderSidebar(){
  chatList.innerHTML = "";
  if(!chats.length){
    var d = document.createElement("div");
    d.style.cssText = "padding:14px;font-size:13px;color:var(--muted2);text-align:center";
    d.textContent = "No chats yet — say hi!";
    chatList.appendChild(d); return;
  }
  chats.forEach(function(c){
    var el = document.createElement("div");
    el.className = "chat-item"+(c.id===currentId?" active":"");
    var dot = document.createElement("span"); dot.className="dot";
    var label = document.createElement("span");
    label.textContent = c.title || "New chat"; label.style.cssText="flex:1;overflow:hidden;text-overflow:ellipsis";
    var del = document.createElement("button"); del.className="del"; del.textContent="×"; del.title="Delete chat";
    del.onclick = function(e){ e.stopPropagation(); deleteChat(c.id); };
    el.appendChild(dot); el.appendChild(label); el.appendChild(del);
    el.onclick = function(){ openChat(c.id); closeDrawer(); };
    chatList.appendChild(el);
  });
}
function messageNode(role, html){
  var wrap = document.createElement("div");
  wrap.className = "msg "+role;
  var av = document.createElement("div");
  av.className = "avatar"+(role==="user"?" you":"");
  if(role==="bot"){ var im=document.createElement("img"); im.src="assets/icon.png"; im.alt="RipoBot"; av.appendChild(im); }
  else av.textContent = "Y";
  var b = document.createElement("div"); b.className="bubble"; b.innerHTML = html;
  wrap.appendChild(av); wrap.appendChild(b);
  return wrap;
}
function renderMessages(){
  messagesEl.innerHTML = "";
  var c = getChat();
  emptyEl.style.display = (!c || !c.messages.length) ? "flex" : "none";
  if(!c) return;
  c.messages.forEach(function(m){
    if(m.role==="user") messagesEl.appendChild(messageNode("user", md(m.content)));
    else if(m.role==="assistant"){
      var n = messageNode("bot", md(m.content));
      var tools = document.createElement("div"); tools.className="tools";
      var sp = document.createElement("button"); sp.className="mini-btn"; sp.textContent="🔊 Listen";
      sp.onclick = function(){ speak(plainText(m.content)); };
      tools.appendChild(sp); n.querySelector(".bubble").appendChild(tools);
      messagesEl.appendChild(n);
    } else if(m.role==="error"){
      var e = messageNode("bot", esc(m.content));
      e.classList.add("error");
      var rb = document.createElement("button"); rb.className="mini-btn"; rb.textContent="↻ Retry";
      rb.onclick = function(){ retryLast(); };
      var td = document.createElement("div"); td.className="tools"; td.appendChild(rb);
      e.querySelector(".bubble").appendChild(td);
      messagesEl.appendChild(e);
    }
  });
  scrollEl.scrollTop = scrollEl.scrollHeight;
}
function nearBottom(){ return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }

/* ================= chat ops ================= */
function newChat(){
  stopSpeak();
  var c = { id:"c"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
            title:"New chat", updatedAt:Date.now(), messages:[] };
  chats.unshift(c); currentId = c.id; save(); renderSidebar(); renderMessages(); input.focus();
}
function openChat(id){ stopSpeak(); currentId = id; renderSidebar(); renderMessages(); }
function deleteChat(id){
  chats = chats.filter(function(c){return c.id!==id;});
  if(currentId===id){ currentId = chats.length?chats[0].id:null; }
  save(); renderSidebar(); renderMessages();
}
function setTitle(c){
  var first = c.messages.find(function(m){return m.role==="user";});
  if(first){ c.title = first.content.slice(0,42).trim() + (first.content.length>42?"…":""); }
}
function closeDrawer(){ sidebar.classList.remove("open"); scrim.classList.remove("show"); }

/* ================= streaming chat ================= */
function setStreaming(on){
  streaming = on;
  sendBtn.classList.toggle("stop", on);
  sendBtn.innerHTML = on ? "■" : "➤";
  sendBtn.disabled = false;
  input.disabled = on;
}
function bubbleForStreaming(){
  var n = messageNode("bot", '<span class="typing"><span></span><span></span><span></span></span>');
  messagesEl.appendChild(n); scrollEl.scrollTop = scrollEl.scrollHeight;
  return n.querySelector(".bubble");
}
async function send(text){
  text = (text||"").trim();
  if(!text || streaming) return;
  stopSpeak();
  var c = getChat();
  if(!c){ newChat(); c = getChat(); }
  c.messages.push({role:"user", content:text});
  setTitle(c); c.updatedAt = Date.now(); save();
  renderSidebar(); renderMessages();
  input.value = ""; autosize();

  var history = [{role:"system", content:SYSTEM_PROMPT}];
  c.messages.slice(-14).forEach(function(m){
    if(m.role==="user"||m.role==="assistant") history.push({role:m.role, content:m.content});
  });

  setStreaming(true);
  var bubble = bubbleForStreaming();
  aborter = new AbortController();
  var full = "", done = false;
  try{
    var res = await fetch(API_URL, {
      method:"POST", signal:aborter.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:MODEL, messages:history, stream:true})
    });
    if(!res.ok || !res.body) throw new Error("http "+res.status);
    var reader = res.body.getReader(), decoder = new TextDecoder(), buf = "";
    var firstChunk = true;
    while(true){
      var r = await reader.read();
      if(r.done) break;
      buf += decoder.decode(r.value, {stream:true});
      var idx;
      while((idx = buf.indexOf("\n")) >= 0){
        var line = buf.slice(0,idx).trim(); buf = buf.slice(idx+1);
        if(line.indexOf("data:") !== 0) continue;
        var data = line.slice(5).trim();
        if(data === "[DONE]"){ done = true; break; }
        try{
          var j = JSON.parse(data);
          var delta = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || "";
          if(delta){
            if(firstChunk){ bubble.innerHTML=""; firstChunk=false; }
            full += delta;
            bubble.innerHTML = md(full) + '<span class="cursor"></span>';
            if(nearBottom()) scrollEl.scrollTop = scrollEl.scrollHeight;
          }
        }catch(e){}
      }
      if(done) break;
    }
    if(!full.trim()) throw new Error("empty");
    bubble.innerHTML = md(full);
    var tools = document.createElement("div"); tools.className="tools";
    var sp = document.createElement("button"); sp.className="mini-btn"; sp.textContent="🔊 Listen";
    sp.onclick = (function(txt){ return function(){ speak(plainText(txt)); }; })(full);
    tools.appendChild(sp); bubble.appendChild(tools);
    c.messages.push({role:"assistant", content:full});
    c.updatedAt = Date.now(); save(); renderSidebar();
    if(voiceOn) speak(plainText(full));
  }catch(err){
    if(err && err.name === "AbortError"){
      if(full.trim()){
        bubble.innerHTML = md(full);
        c.messages.push({role:"assistant", content:full});
      } else bubble.closest(".msg").remove();
      c.updatedAt = Date.now(); save();
    } else {
      bubble.closest(".msg").remove();
      c.messages.push({role:"error", content:"Hmm, I hiccuped reaching my brain (the free AI lane might be busy). Give me a sec and hit Retry — no worries."});
      save();
    }
    renderMessages();
  }
  setStreaming(false); aborter = null;
  scrollEl.scrollTop = scrollEl.scrollHeight;
}
function retryLast(){
  var c = getChat(); if(!c) return;
  c.messages = c.messages.filter(function(m){return m.role!=="error";});
  var lastUser = null;
  for(var i=c.messages.length-1;i>=0;i--){ if(c.messages[i].role==="user"){ lastUser=c.messages[i].content; c.messages.splice(i,1); break; } }
  renderMessages();
  if(lastUser) send(lastUser);
}

/* ================= voice in / out ================= */
var recog = null, recognizing = false;
function setupMic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ micBtn.style.display="none"; return; }
  micBtn.onclick = function(){
    if(recognizing){ recog.stop(); return; }
    recog = new SR();
    recog.lang = navigator.language || "en-US";
    recog.interimResults = true; recog.continuous = false;
    var base = input.value;
    recog.onresult = function(e){
      var txt = "";
      for(var i=0;i<e.results.length;i++) txt += e.results[i][0].transcript;
      input.value = (base ? base+" " : "") + txt; autosize();
    };
    recog.onend = function(){ recognizing=false; micBtn.classList.remove("rec"); };
    recog.onerror = function(){ recognizing=false; micBtn.classList.remove("rec"); };
    try{ recog.start(); recognizing=true; micBtn.classList.add("rec"); }catch(e){}
  };
}
function speak(text){
  try{
    if(!("speechSynthesis" in window) || !text) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.slice(0,600));
    u.rate = 1.02; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
function renderVoiceBtn(){ voiceBtn.textContent = voiceOn ? "🔊" : "🔇"; voiceBtn.classList.toggle("on", voiceOn); }

/* ================= wiring ================= */
function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,160)+"px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
});
function doSend(){
  if(streaming){ if(aborter) aborter.abort(); return; }
  send(input.value);
}
sendBtn.onclick = doSend;
$("new-chat").onclick = function(){ newChat(); closeDrawer(); };
$("hamburger").onclick = function(){ sidebar.classList.add("open"); scrim.classList.add("show"); };
scrim.onclick = closeDrawer;
voiceBtn.onclick = function(){
  voiceOn = !voiceOn;
  localStorage.setItem(LS_VOICE, voiceOn?"1":"0");
  renderVoiceBtn();
  if(!voiceOn) stopSpeak();
  else speak("Voice replies on!");
};
(function buildChips(){
  var box = $("chips");
  SUGGESTIONS.forEach(function(s){
    var b = document.createElement("button");
    b.className="chip"; b.textContent=s;
    b.onclick=function(){ input.value=s; send(s); };
    box.appendChild(b);
  });
})();

/* ================= init ================= */
setupMic(); renderVoiceBtn(); autosize();
if(!chats.length){ newChat(); }
else { currentId = chats[0].id; renderSidebar(); renderMessages(); }
renderSidebar();
})();
</script>
